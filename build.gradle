plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // CurseMaven: the pack's mods from CurseForge, for dev runs (see dependencies below), as curse.maven:<slug>-<project>:<file>.
    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    // The Curios API, compiled against so dungeon loot in Curios slots can be found.
    exclusiveContent {
        forRepository {
            maven {
                name = "Curios"
                url = "https://maven.theillusivec4.top/"
            }
        }
        filter {
            includeGroup "top.theillusivec4.curios"
        }
    }

}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional integrations, compiled against only: each is used only when its mod is installed.
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"     // gold jewelry in Curios slots
    compileOnly "curse.maven:puffish-skills-835091:9101377"                     // Pufferfish's Skills 0.19.2: the skill trees
    compileOnly "curse.maven:irons-spells-n-spellbooks-855414:8680204"          // 1.21.1-3.16.3: casting trains the magic schools
    compileOnly "curse.maven:irons-lib-1492763:8973642"
    compileOnly "curse.maven:better-combat-by-daedelus-639842:8430183"         // 2.4.0+1.21.1-neoforge: weapon types for the combat styles
    compileOnly "curse.maven:spell-engine-807653:9011566"                      // 1.10.9+1.21.1-neoforge: forged staves cast, spells train schools
    compileOnly "curse.maven:spell-power-771265:8634104"                       // 1.6.0+1.21.1-neoforge
    compileOnly "curse.maven:apotheosis-313970:8993983"                        // 1.21.1-8.9.0: what a forged piece's stars mean to Apotheosis
    compileOnly "curse.maven:placebo-283644:9153039"                           // 1.21.1-9.9.4
    compileOnly "curse.maven:apothic-attributes-898963:9006294"                // 1.21.1-2.11.0

    // Mods loaded in dev runs and game tests, so the integrations can be tried. localRuntime keeps them out of this
    // mod's published dependencies: it doesn't require any. Versions match the pack's pack.json.
    if (!gradle.startParameter.taskNames.any { it.toLowerCase().contains('rundata') }) {
        localRuntime "curse.maven:puffish-skills-835091:9101377"               // Pufferfish's Skills 0.19.2
        localRuntime "curse.maven:curios-309927:6529130"                       // 9.5.1+1.21.1
        localRuntime "curse.maven:patchouli-306770:7730942"                    // 1.21.1-93-neoforge: the Smith's Handbook
        localRuntime "curse.maven:farmers-delight-398521:8765184"             // 1.21.1-1.3.4: bark, straw, canvas and knives for the professions
        // Apotheosis and its libraries
        localRuntime "curse.maven:apotheosis-313970:8993983"                   // 1.21.1-8.9.0
        localRuntime "curse.maven:placebo-283644:9153039"                      // 1.21.1-9.9.4
        localRuntime "curse.maven:apothic-attributes-898963:9006294"           // 1.21.1-2.11.0
        localRuntime "curse.maven:apothic-enchanting-1063926:9095862"          // 1.21.1-1.6.4
        localRuntime "curse.maven:apothic-spawners-986583:8469405"            // 1.21.1-1.4.0
        // Iron's Spells 'n Spellbooks and its libraries
        localRuntime "curse.maven:irons-spells-n-spellbooks-855414:8680204"    // 1.21.1-3.16.3
        localRuntime "curse.maven:irons-lib-1492763:8973642"                   // 1.21.1-2.2.0
        localRuntime "curse.maven:playeranimator-658587:7389814"              // 2.0.4+1.21.1
        localRuntime "curse.maven:geckolib-388172:8893490"                    // 4.9.3
        // Better Combat, Spell Engine and the RPG Series' skill tree, with their libraries
        localRuntime "curse.maven:better-combat-by-daedelus-639842:8430183"    // 2.4.0+1.21.1-neoforge
        localRuntime "curse.maven:spell-engine-807653:9011566"                 // 1.10.9+1.21.1-neoforge
        localRuntime "curse.maven:spell-power-771265:8634104"                  // 1.6.0+1.21.1-neoforge
        localRuntime "curse.maven:bundle-api-1189983:7006149"                  // 1.1.0-neoforge
        localRuntime "curse.maven:ranged-weapon-api-962162:8723067"           // 3.0.0+1.21.1-neoforge
        localRuntime "curse.maven:armor-model-api-1659764:8793923"             // 1.1.0+1.21.1-neoforge
        localRuntime "curse.maven:shield-api-1048720:7156464"                  // 2.2.0-neoforge
        localRuntime "curse.maven:critical-strike-1379562:7224268"             // 1.0.4+1.21.1-neoforge
        localRuntime "curse.maven:structure-pool-api-927915:7145227"           // 1.2.1+1.21.1-neoforge
        localRuntime "curse.maven:cloth-config-348521:5729127"                 // 15.0.140+neoforge
        localRuntime "curse.maven:rune-crafting-775518:8702937"                // 1.3.2+1.21.1-neoforge: the Wizards and Paladins need it
        localRuntime "curse.maven:wizards-734325:8982151"                      // 3.1.3+1.21.1-neoforge
        localRuntime "curse.maven:paladins-and-priests-856548:8982136"         // 3.1.3+1.21.1-neoforge
        localRuntime "curse.maven:rogues-and-warriors-1048409:8982142"         // 3.1.3+1.21.1-neoforge
        localRuntime "curse.maven:archers-932359:8982143"                      // 3.1.3+1.21.1-neoforge
        localRuntime "curse.maven:jewelry-910706:9002835"                      // 2.5.1+1.21.1-neoforge
        localRuntime "curse.maven:skill-tree-1311513:8982842"                  // 1.6.1+1.21.1-neoforge
        // The extra spell schools (earth, water, air) the magic trees reward
        localRuntime "curse.maven:more-rpg-library-923030:9129315"            // 2.8.0+1.21.1-neoforge
        localRuntime "curse.maven:elemental-wizards-rpg-class-1006892:9129748" // 3.2.0+1.21.1-neoforge
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
